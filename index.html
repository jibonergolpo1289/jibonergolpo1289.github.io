<!-- Load data.js BEFORE this script -->

  document.getElementById('disclaimer-title').textContent = disclaimerData.title;

  <a href="contact.html">Contact Us</a>

<script src="data.js"></script>
<script>
  const grid = document.getElementById('category-grid');
  CATEGORIES.forEach(cat => {
    const count = PIECES.filter(p => p.category === cat.slug).length;
    const card = document.createElement('a');
    card.className = 'category-card';
    card.href = `category.html?cat=${cat.slug}`;
    card.innerHTML = `
      <div class="category-name">${cat.name}</div>
      <div class="category-count">${count} টি লেখা</div>
    `;
    grid.appendChild(card);
  });

</script>
  <script>
  const searchInput = document.getElementById('search-input');
  const resultsBox = document.getElementById('search-results');
  searchInput.addEventListener('input', () => {
    const query = searchInput.value.trim().toLowerCase();
    resultsBox.innerHTML = '';
    if (query.length === 0) return;
    const matches = PIECES.filter(p =>
      p.title.toLowerCase().includes(query)
    );
    if (matches.length === 0) {
      resultsBox.innerHTML = '<p>কোনো ফলাফল পাওয়া যায়নি।</p>';
      return;
    }
    matches.forEach(piece => {
      const item = document.createElement('a');
      item.href = `piece.html?id=${piece.id}`;
      item.className = 'search-result-item';
      item.textContent = piece.title;
      resultsBox.appendChild(item);
    });
  });
</script>

</body>
